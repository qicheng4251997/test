<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoyHaven · Your Gift Is Ready</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf8f1;--ink:#33201c;--muted:#8d7a72;--coral:#d9432f;--coral2:#f0705a;--sun:#f4b860;--line:#ecd9c6;--peach:#ffe6d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,-apple-system,"Helvetica Neue",Arial,sans-serif;
background:radial-gradient(60% 34% at 85% 4%,#ffe9d9 0,transparent 70%),radial-gradient(50% 30% at 8% 40%,#fff0c9 0,transparent 70%),var(--bg);
display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 20px 26px;overflow-x:hidden}
.pill{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--coral);background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:99px}
.stage{position:relative;width:min(280px,74vw);aspect-ratio:1;margin-top:44px}
.blob{position:absolute;inset:4% 0 0;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;background:radial-gradient(circle at 35% 30%,#fff2e6,var(--peach) 55%,#ffc9ae);animation:morph 9s ease-in-out infinite alternate;box-shadow:0 24px 40px rgba(217,67,47,.14)}
@keyframes morph{to{border-radius:54% 46% 46% 54%/46% 54% 46% 54%}}
.mascot{position:absolute;width:112%;left:-6%;top:-14%;height:auto;filter:drop-shadow(0 14px 16px rgba(90,20,10,.28));animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(2deg)}}
.dot{position:absolute;border-radius:50%;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(33px,9.6vw,44px);line-height:1.08;margin:10px 0 0;text-align:center;color:var(--ink)}
h1 span{color:var(--coral)}
.lead{margin:0;color:var(--muted);text-align:center;font-size:15px;max-width:30ch}
.ticket{position:relative;display:flex;width:min(400px,100%);background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:0 14px 30px rgba(120,70,40,.1)}
.ticket::before,.ticket::after{content:"";position:absolute;left:62%;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);transform:translateX(-50%)}
.ticket::before{top:-11px;clip-path:inset(50% 0 0 0)}.ticket::after{bottom:-11px;clip-path:inset(0 0 50% 0)}
.tl{flex:0 0 62%;padding:16px 10px 14px;text-align:center;border-right:2px dashed var(--line)}
.tl small,.tr small{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:600}
.gb{width:74px;height:auto;overflow:visible;display:block;margin:0 auto 6px;animation:fl 3s ease-in-out infinite}
.lid{transform-origin:20px 44px;transition:transform .7s cubic-bezier(.3,1.7,.5,1)}
.star{opacity:0;transition:opacity .5s .2s}
.ticket.open .lid{transform:translate(14px,-26px) rotate(-18deg)}
.ticket.open .star{opacity:1}
.ticket.open .gb{animation:none}
.gt{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(21px,6.4vw,26px);line-height:1.15;color:var(--coral);margin-top:6px}
.big{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(58px,18vw,74px);line-height:1.05;color:var(--coral);font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tr{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 6px;text-align:center}
.tr b{font-family:ui-monospace,Menlo,monospace;font-size:22px;color:var(--ink);margin-top:4px}
.slide{position:relative;width:min(400px,100%);height:64px;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--coral2));box-shadow:0 12px 26px rgba(217,67,47,.3);overflow:hidden;user-select:none}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
.slide .lb{position:absolute;inset:0;display:grid;place-items:center;padding-left:48px;font-weight:800;letter-spacing:.03em;font-size:clamp(14px,4.2vw,16px);
background:linear-gradient(100deg,rgba(255,255,255,.6) 30%,#fff 50%,rgba(255,255,255,.6) 70%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.knob{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;font-size:24px;cursor:grab;touch-action:none;background:#fff;box-shadow:0 4px 12px rgba(80,20,10,.25)}
.knob.back{transition:transform .3s}
.slide.done .lb{animation:none;-webkit-text-fill-color:#fff;color:#fff}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div class="slide" id="slide">
 <div class="fill" id="fill"></div>
 <div class="lb" id="lb">Slide to open your gift</div>
 <button class="knob" id="knob" aria-label="Open gift">🎁</button>
</div>

<canvas id="cv"></canvas>

<script>
// ===== 可修改配置 =====
var LINK="https://www.ipay9myr.store/?aff=nsads2";      // 滑动完成后的跳转链接
var s=599,tm=document.getElementById("tm");
setInterval(function(){if(s>0)s--;tm.textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2)},1000);
var slide=document.getElementById("slide"),knob=document.getElementById("knob"),fill=document.getElementById("fill"),lb=document.getElementById("lb");
var sx=0,x=0,drag=false,done=false;
function max(){return slide.clientWidth-knob.offsetWidth-12}
function set(v){x=v;knob.style.transform="translateX("+v+"px)";fill.style.width=(v+58)+"px"}
knob.addEventListener("pointerdown",function(e){if(done)return;drag=true;sx=e.clientX-x;knob.classList.remove("back");knob.setPointerCapture(e.pointerId)});
knob.addEventListener("pointermove",function(e){if(drag)set(Math.max(0,Math.min(max(),e.clientX-sx)))});
function end(){if(!drag)return;drag=false;if(x>max()*.85)finish();else{knob.classList.add("back");set(0)}}
knob.addEventListener("pointerup",end);knob.addEventListener("pointercancel",end);
knob.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")finish()});
function finish(){if(done)return;done=true;knob.classList.add("back");set(max());slide.classList.add("done");document.querySelector(".ticket").classList.add("open");document.getElementById("gt").innerHTML="Gift<br>unlocked!";knob.textContent="✓";
 lb.textContent="Opened! Taking you there…";confetti();setTimeout(function(){if(LINK!=="#")location.href=LINK},1300)}
var cv=document.getElementById("cv"),cx=cv.getContext("2d"),P=[];
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 var w=cv.width=innerWidth,h=cv.height=innerHeight,C=["#d9432f","#f0705a","#f4b860","#ffd9b8","#ffffff"];
 [[.2,.8,.5],[.8,.8,-.5],[.5,.6,0]].forEach(function(o){for(var i=0;i<45;i++){var a=-Math.PI/2+o[2]+(Math.random()-.5)*1.4,v=8+Math.random()*9;
  P.push({x:o[0]*w,y:o[1]*h,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:6+Math.random()*5,c:C[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4})}});
 requestAnimationFrame(step)}
function step(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.y<cv.height+20});
 P.forEach(function(p){p.vy+=.3;p.vx*=.985;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 if(P.length)requestAnimationFrame(step)}
</script>
